# Spirit Furnace: single source of truth for all app themes.
# Edit here, then run `python build/build.py` to regenerate every app file.
# Accents are shared across variants unless a variant overrides keys in its own
# [variants.<name>.accents] / [variants.<name>.bright] tables.

# order controls emission order in palette.lua
order = ["furnace", "lifted", "paper"]

[accents]
# neutrals: sage incense smoke for comments, jade-grey ash for the quieter
# chrome, aged-scripture paper for text.
ash     = "#627665"
incense = "#75907a"
text    = "#f6e7cb"

# spirit furnace: a cultivator's pill furnace. Calm mineral pigments from
# blue-green landscape painting carry the code; the bold signals are kept for
# what needs to cut through (errors, cursor, search, git state).
# heaven = azurite sky (keywords), jade = qi (functions), elixir = gamboge pills
# (strings/numbers/constants), blossom = wisteria (types/props/members),
# furnace = refining fire (params/directives/links), core = celadon qi glow (UI
# titles, directories, focus, cursor; kept off the warm side), tribulation = cinnabar (errors),
# herb = spirit herb (positive/added).
heaven      = "#749ad2"
jade        = "#58b98a"
elixir      = "#ebb944"
blossom     = "#cc95dc"
# member = lotus pink: properties, fields, map/tfvars/yaml keys, split off types
member      = "#f27ab8"
furnace     = "#e48a45"
core        = "#a9e3c9"
tribulation = "#f5502a"
herb        = "#9dc957"
cursor      = "#a9e3c9"
# prompt bar (p10k segments) and its secondary pill: grey-jade ink, so a green branch name still stands out
bar         = "#2c4037"
bar_alt     = "#1f332a"

# bright ANSI (8..15); 8 = black, 15 = text, plus normal-7 white. 8 doubles as
# Claude Code's panel / prompt-row background (ANSI themes), so it is deep malachite.
# ANSI pairs: 1/9 tribulation, 2/10 herb, 3/11 elixir, 4/12 heaven,
# 5/13 blossom, 6/14 jade. furnace and core have no ANSI slot.
[bright]
black   = "#35704c"
white7  = "#dcceb4"
red     = "#ff795a"
green   = "#bae183"
yellow  = "#ffd579"
blue    = "#92b3e4"
magenta = "#e2b2f0"
cyan    = "#81d0a6"

# delta diff backgrounds are computed per variant in build.py: tribulation/herb
# blended onto that variant's base at 25% (line) and 40% (emph).

[variants.furnace]
suffix       = ""
comment      = ["furnace: lacquered rosewood brown, lit from the pill furnace (default)"]
base         = "#261207"
surface      = "#33190b"
overlay      = "#2e2e1d"
_nc          = "#1e0902"
hl_low       = "#3f291c"
hl_med       = "#664534"
hl_high      = "#795846"
inactive_tab = "#3f2516"
border       = "#35442e"
selection    = "#003f4b"

[variants.lifted]
suffix       = "Lifted"
comment      = [
  "lifted: furnace with the floor raised and the steps widened, so the depth",
  "survives on a basic laptop LCD instead of crushing to flat brown.",
]
base         = "#2e170c"
surface      = "#412619"
overlay      = "#353321"
_nc          = "#271107"
hl_low       = "#4b3226"
hl_med       = "#6c4b3a"
hl_high      = "#7f5e4c"
inactive_tab = "#412718"
border       = "#3b4832"
selection    = "#002e3a"

[variants.paper]
suffix       = "Paper"
mode         = "light"
comment      = [
  "paper: an old yellowed scroll, dimmed well below white so it never glares.",
  "Pigments re-fit to ~4.5:1; core is ink-lacquer since gold and green crowd on paper.",
]
base         = "#c9b98f"
surface      = "#c1b082"
overlay      = "#b7a573"
_nc          = "#c3b389"
hl_low       = "#b0aa99"
hl_med       = "#99917d"
hl_high      = "#857c65"
inactive_tab = "#bfb086"
border       = "#ae9d70"
selection    = "#b9ceac"

[variants.paper.accents]
ash         = "#7c6c56"
incense     = "#5e503d"
text        = "#2d2216"
heaven      = "#1d4988"
jade        = "#00563b"
elixir      = "#634500"
blossom     = "#673575"
member      = "#8a165c"
furnace     = "#7b3600"
core        = "#683f4c"
tribulation = "#951300"
herb        = "#305400"
cursor      = "#951300"
bar         = "#adab83"
bar_alt     = "#9da37d"

[variants.paper.bright]
