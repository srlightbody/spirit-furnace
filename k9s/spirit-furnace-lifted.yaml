# Spirit Furnace Lifted - k9s skin
# place in ~/.config/k9s/skins/spirit-furnace-lifted.yaml, then set in config.yaml:
#   k9s:
#     ui:
#       skin: spirit-furnace-lifted

k9s:
  body:
    fgColor: "#f6e7cb"
    bgColor: "#2e170c"
    logoColor: "#a9e3c9"
  prompt:
    fgColor: "#f6e7cb"
    bgColor: "#2e170c"
    suggestColor: "#e48a45"
  info:
    fgColor: "#a9e3c9"
    sectionColor: "#f6e7cb"
  dialog:
    fgColor: "#f6e7cb"
    bgColor: "#2e170c"
    buttonFgColor: "#2e170c"
    buttonBgColor: "#a9e3c9"
    buttonFocusFgColor: "#2e170c"
    buttonFocusBgColor: "#9dc957"
    labelFgColor: "#ebb944"
    fieldFgColor: "#f6e7cb"
  frame:
    border:
      fgColor: "#583926"
      focusColor: "#58b98a"
    menu:
      fgColor: "#f6e7cb"
      keyColor: "#e48a45"
      numKeyColor: "#e48a45"
    crumbs:
      fgColor: "#2e170c"
      bgColor: "#806c55"
      activeColor: "#a9e3c9"
    status:
      newColor: "#a9e3c9"
      modifyColor: "#749ad2"
      addColor: "#9dc957"
      errorColor: "#f5502a"
      highlightColor: "#ebb944"
      killColor: "#e48a45"
      completedColor: "#806c55"
    title:
      fgColor: "#f6e7cb"
      bgColor: "#2e170c"
      highlightColor: "#ebb944"
      counterColor: "#e48a45"
      filterColor: "#a9e3c9"
  views:
    charts:
      bgColor: "#2e170c"
      defaultDialColors:
        - "#a9e3c9"
        - "#f5502a"
      defaultChartColors:
        - "#a9e3c9"
        - "#f5502a"
    table:
      fgColor: "#f6e7cb"
      bgColor: "#2e170c"
      cursorFgColor: "#f6e7cb"
      cursorBgColor: "#363725"
      header:
        fgColor: "#f6e7cb"
        bgColor: "#2e170c"
        sorterColor: "#9dc957"
    xray:
      fgColor: "#f6e7cb"
      bgColor: "#2e170c"
      cursorColor: "#363725"
      graphicColor: "#a9e3c9"
    yaml:
      keyColor: "#749ad2"
      colonColor: "#9a8467"
      valueColor: "#f6e7cb"
    logs:
      fgColor: "#f6e7cb"
      bgColor: "#2e170c"
      indicator:
        fgColor: "#a9e3c9"
        bgColor: "#2e170c"
