# Spirit Furnace Paper - k9s skin
# place in ~/.config/k9s/skins/spirit-furnace-paper.yaml, then set in config.yaml:
#   k9s:
#     ui:
#       skin: spirit-furnace-paper

k9s:
  body:
    fgColor: "#2d2216"
    bgColor: "#c9b98f"
    logoColor: "#683f4c"
  prompt:
    fgColor: "#2d2216"
    bgColor: "#c9b98f"
    suggestColor: "#7b3600"
  info:
    fgColor: "#683f4c"
    sectionColor: "#2d2216"
  dialog:
    fgColor: "#2d2216"
    bgColor: "#c9b98f"
    buttonFgColor: "#c9b98f"
    buttonBgColor: "#683f4c"
    buttonFocusFgColor: "#c9b98f"
    buttonFocusBgColor: "#305400"
    labelFgColor: "#634500"
    fieldFgColor: "#2d2216"
  frame:
    border:
      fgColor: "#ae9d70"
      focusColor: "#00563b"
    menu:
      fgColor: "#2d2216"
      keyColor: "#7b3600"
      numKeyColor: "#7b3600"
    crumbs:
      fgColor: "#c9b98f"
      bgColor: "#7c6c56"
      activeColor: "#683f4c"
    status:
      newColor: "#683f4c"
      modifyColor: "#1d4988"
      addColor: "#305400"
      errorColor: "#951300"
      highlightColor: "#634500"
      killColor: "#7b3600"
      completedColor: "#7c6c56"
    title:
      fgColor: "#2d2216"
      bgColor: "#c9b98f"
      highlightColor: "#634500"
      counterColor: "#7b3600"
      filterColor: "#683f4c"
  views:
    charts:
      bgColor: "#c9b98f"
      defaultDialColors:
        - "#683f4c"
        - "#951300"
      defaultChartColors:
        - "#683f4c"
        - "#951300"
    table:
      fgColor: "#2d2216"
      bgColor: "#c9b98f"
      cursorFgColor: "#2d2216"
      cursorBgColor: "#b9ceac"
      header:
        fgColor: "#2d2216"
        bgColor: "#c9b98f"
        sorterColor: "#305400"
    xray:
      fgColor: "#2d2216"
      bgColor: "#c9b98f"
      cursorColor: "#b9ceac"
      graphicColor: "#683f4c"
    yaml:
      keyColor: "#1d4988"
      colonColor: "#5e503d"
      valueColor: "#2d2216"
    logs:
      fgColor: "#2d2216"
      bgColor: "#c9b98f"
      indicator:
        fgColor: "#683f4c"
        bgColor: "#c9b98f"
