  read: "#943e50"
  write: "#795a00"
  exec: "#a92c18"
  exec-sticky: "#8e4717"
  no-access: "#8c7c66"
  octal: "#59623b"
  acl: "#59623b"
  context: "#8e4717"
date:
  hour-old: "#59623b"
  day-old: "#59623b"
  older: "#8c7c66"
size:
