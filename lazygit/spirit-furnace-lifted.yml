# Spirit Furnace Lifted - lazygit
# Keep this as a standalone file and layer it over your config via LG_CONFIG_FILE:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/spirit-furnace-lifted.yml"
# (rightmost wins) so theme updates never touch your personal config.

gui:
  theme:
    activeBorderColor:
      - "#a9e3c9"
      - bold
    inactiveBorderColor:
      - "#806c55"
    searchingActiveBorderColor:
      - "#ebb944"
      - bold
    optionsTextColor:
      - "#749ad2"
    selectedLineBgColor:
      - "#583926"
    cherryPickedCommitFgColor:
      - "#a9e3c9"
    cherryPickedCommitBgColor:
      - "#6c4b3a"
    markedBaseCommitFgColor:
      - "#ebb944"
    markedBaseCommitBgColor:
      - "#6c4b3a"
    unstagedChangesColor:
      - "#f5502a"
    defaultFgColor:
      - "#f6e7cb"
  authorColors:
    "*": "#e48a45"
