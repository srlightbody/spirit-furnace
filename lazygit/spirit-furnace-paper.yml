# Spirit Furnace Paper - lazygit
# Keep this as a standalone file and layer it over your config via LG_CONFIG_FILE:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/spirit-furnace-paper.yml"
# (rightmost wins) so theme updates never touch your personal config.

gui:
  theme:
    activeBorderColor:
      - "#59623b"
      - bold
    inactiveBorderColor:
      - "#8c7c66"
    searchingActiveBorderColor:
      - "#795a00"
      - bold
    optionsTextColor:
      - "#2e5a9b"
    selectedLineBgColor:
      - "#cabfa6"
    cherryPickedCommitFgColor:
      - "#59623b"
    cherryPickedCommitBgColor:
      - "#bab2a2"
    markedBaseCommitFgColor:
      - "#795a00"
    markedBaseCommitBgColor:
      - "#bab2a2"
    unstagedChangesColor:
      - "#a92c18"
    defaultFgColor:
      - "#3a2e22"
  authorColors:
    "*": "#8e4717"
