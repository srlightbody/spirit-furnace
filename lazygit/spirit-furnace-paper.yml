# Spirit Furnace Paper - lazygit
# Keep this as a standalone file and layer it over your config via LG_CONFIG_FILE:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/spirit-furnace-paper.yml"
# (rightmost wins) so theme updates never touch your personal config.

gui:
  theme:
    activeBorderColor:
      - "#683f4c"
      - bold
    inactiveBorderColor:
      - "#7c6c56"
    searchingActiveBorderColor:
      - "#634500"
      - bold
    optionsTextColor:
      - "#1d4988"
    selectedLineBgColor:
      - "#ae9d70"
    cherryPickedCommitFgColor:
      - "#683f4c"
    cherryPickedCommitBgColor:
      - "#99917d"
    markedBaseCommitFgColor:
      - "#634500"
    markedBaseCommitBgColor:
      - "#99917d"
    unstagedChangesColor:
      - "#951300"
    defaultFgColor:
      - "#2d2216"
  authorColors:
    "*": "#7b3600"
