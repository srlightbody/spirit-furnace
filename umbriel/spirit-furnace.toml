# Spirit Furnace - umbriel
# add to [include] files in config.toml, after your shared config:  "~/.config/umbriel/spirit-furnace.toml"

[colors]
background = "#261207ff"
backdrop = "#261207ff"
text_primary = "#f6e7cbff"
text_muted = "#627665ff"
accent_primary = "#a9e3c9ff"
accent_secondary = "#ebb944ff"
