# Spirit Furnace Paper - umbriel
# add to [include] files in config.toml, after your shared config:  "~/.config/umbriel/spirit-furnace-paper.toml"

[colors]
background = "#c9b98fff"
backdrop = "#c9b98fff"
text_primary = "#2d2216ff"
text_muted = "#7c6c56ff"
accent_primary = "#683f4cff"
accent_secondary = "#634500ff"
error = "#951300ff"
warning = "#634500ff"
insert_hint = "#683f4c80"
shadow = "#c3b3897f"

[colors.border]
